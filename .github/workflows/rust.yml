name: Cargo Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: docs
      - run: rustup update nightly && rustup default nightly
      - run: cargo install cargo-docs-rs
      - run: RUSTDOCFLAGS="-D warnings" cargo docs-rs
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["stable", "beta", "nightly"]
        crypto: ["ring", "aws-lc-rs", "ring,aws-lc-rs"]
        tokio: ["tokio", "axum", "tower", ""]
    steps:
      - run: |
          CACHE_KEY=${{ matrix.toolchain }},${{ matrix.crypto }},${{ matrix.tokio }}
          CACHE_KEY=${CACHE_KEY//,/_}
          echo CACHE_KEY=${CACHE_KEY} >> ${GITHUB_ENV}
      - uses: actions/checkout@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ env.CACHE_KEY }}
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: rustup component add clippy
      - run: rustup component add rustfmt
      - run: cargo fmt --check
      - run: cargo build --verbose --no-default-features --features default-http-client,webpki-roots,${{ matrix.crypto }},${{ matrix.tokio }}
      - run: cargo test --verbose --no-default-features --features default-http-client,webpki-roots,${{ matrix.crypto }},${{ matrix.tokio }}
      - run: cargo clippy --tests --no-default-features --features default-http-client,webpki-roots,${{ matrix.crypto }},${{ matrix.tokio }} -- -D warnings
  pluggable_http_client:
    # Guards that the crate builds and works with a custom AcmeHttpClient when the built-in
    # default-http-client is disabled. The examples require default-http-client, so this job
    # restricts compilation to the library and the pluggable_http_client integration test.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crypto: ["ring", "aws-lc-rs"]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: no_default_http_client_${{ matrix.crypto }}
      - run: rustup update stable && rustup default stable
      - run: rustup component add clippy
      - run: cargo build --verbose --no-default-features --features webpki-roots,${{ matrix.crypto }}
      - run: cargo test --verbose --no-default-features --features webpki-roots,${{ matrix.crypto }} --lib --test pluggable_http_client
      - run: cargo clippy --no-default-features --features webpki-roots,${{ matrix.crypto }} --lib --test pluggable_http_client -- -D warnings
