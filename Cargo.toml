[package]
name = "rustls-acme"
version = "0.15.4"
authors = ["Florian Uekermann <florian@uekermann.me>"]
edition = "2018"
description = "TLS certificate management and serving using rustls"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/FlorianUekermann/rustls-acme"
documentation = "https://docs.rs/rustls-acme"
keywords = ["acme", "rustls", "tls", "letsencrypt"]
categories = ["asynchronous", "cryptography", "network-programming"]

[dependencies]
futures-rustls = { version = "0.26.0", default-features = false }
futures = "0.3.34"
rcgen = { version = "0.14.10", default-features = false, features = ["pem"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features=["derive"] }
ring = { version = "0.17.14", features = ["std"], optional = true }
aws-lc-rs = { version = "1.19.0", optional = true, default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"
log = "0.4.35"
webpki-roots = { version = "1.0.12", optional = true }
pem = "4.0.0"
thiserror = "2.0.21"
x509-parser = ">=0.18.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
async-trait = "0.1.92"
async-io = "2.6.0"
tokio = { version= "1.54.1", optional = true }
tokio-util = { version="0.7.20", features = ["compat"], optional = true }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"], optional = true }
async-web-client = { version = "0.6.4", default-features = false }
http = "1.5.0"
blocking = "1.7.0"
tower-service = { version = "0.3.3", optional=true }

[dev-dependencies]
simple_logger = "5.2.0"
clap = { version = "4.6.8", features = ["derive"] }
axum = "0.8.9"
tokio = { version="1.54.1", features = ["full"] }
tokio-stream = { version="0.1.19", features = ["net"] }
tokio-util = { version="0.7.20", features = ["compat"] }
warp = "0.4.4"
smol = "2.0.2"
tokio-rustls = { version = "0.26.6", default-features = false }
smol-macros = "0.1.1"
macro_rules_attribute = "0.2.3"
hyper = "1.12.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
hyper-util = "0.1.21"
actix-web = { version = "4.20.0", features = ["actix-tls", "rustls-0_23"]}

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["aws-lc-rs", "tls12", "webpki-roots"]
ring = ["dep:ring", "async-web-client/ring", "rcgen/ring"]
aws-lc-rs = ["dep:aws-lc-rs", "async-web-client/aws-lc-rs", "rcgen/aws_lc_rs"]
axum = ["dep:axum-server", "tower"]
tower = ["dep:tower-service", "tokio"]
tokio = ["dep:tokio", "dep:tokio-util"]
tls12 = ["async-web-client/tls12"]
webpki-roots = ["dep:webpki-roots"]

[[example]]
name="low_level_actix"

[[example]]
name = "low_level_axum"
required-features = ["axum"]

[[example]]
name = "low_level_axum_http01"
required-features = ["axum", "tower"]

[[example]]
name="high_level_warp"
required-features=["tokio"]

[[example]]
name="high_level_tokio"
required-features=["tokio"]

[[example]]
name="high_level_hyper"
required-features=["tokio"]
